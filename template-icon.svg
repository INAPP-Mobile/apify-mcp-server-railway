  <circle cx="100" cy="100" r="28" fill="#FF4500" opacity="0.25"/>
  <!-- Eyes -->
  <rect x="84" y="86" width="12" height="14" rx="3" fill="#FF4500"/>
  <rect x="104" y="86" width="12" height="14" rx="3" fill="#FF4500"/>
  <!-- Mouth -->
  <path d="M88 112q12 8 24 0" stroke="#FF4500" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- Antennae -->
  <path d="M92 68L86 48" stroke="#FF4500" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <path d="M108 68l6-20" stroke="#FF4500" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <circle cx="86" cy="46" r="3" fill="#FF4500" opacity="0.5"/>
  <circle cx="114" cy="46" r="3" fill="#FF4500" opacity="0.5"/>
  <!-- MCP label -->
  <text x="100" y="158" text-anchor="middle" fill="#FF4500" font-family="monospace" font-size="22" font-weight="bold" letter-spacing="3">MCP</text>
  <!-- Web/network lines -->
  <line x1="62" y1="78" x2="48" y2="56" stroke="#FF4500" stroke-width="1" opacity="0.3"/>
  <line x1="138" y1="78" x2="152" y2="56" stroke="#FF4500" stroke-width="1" opacity="0.3"/>
  <line x1="62" y1="122" x2="44" y2="140" stroke="#FF4500" stroke-width="1" opacity="0.3"/>
  <line x1="138" y1="122" x2="156" y2="140" stroke="#FF4500" stroke-width="1" opacity="0.3"/>
  <!-- Connection dots -->
  <circle cx="48" cy="56" r="2.5" fill="#FF4500" opacity="0.4"/>
  <circle cx="152" cy="56" r="2.5" fill="#FF4500" opacity="0.4"/>
  <circle cx="44" cy="140" r="2.5" fill="#FF4500" opacity="0.4"/>
  <circle cx="156" cy="140" r="2.5" fill="#FF4500" opacity="0.4"/>
